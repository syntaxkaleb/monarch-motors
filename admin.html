<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monarch Motors - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white p-6 min-h-screen flex items-center justify-center">

    <div class="max-w-lg w-full bg-gray-900 p-8 rounded-xl border border-gray-800 shadow-2xl">
        <div class="flex items-center space-x-3 mb-6">
            <img src="monarch-logo.png" alt="Monarch Motors Logo" class="h-8 w-auto rounded object-contain">
            <h1 class="text-xl font-black text-red-600 uppercase tracking-wider">Add New Vehicle</h1>
        </div>
        
        <form id="vehicle-form" class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Vehicle Title</label>
                <input type="text" id="title" placeholder="2018 Mazda Mazda3 Sport" required class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-red-600">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Price</label>
                    <input type="text" id="price" placeholder="$11,995" required class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Category</label>
                    <select id="category" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-red-600">
                        <option value="sedan">Sedan / Hatchback</option>
                        <option value="suv">SUV / Crossover / Truck</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Mileage</label>
                    <input type="text" id="mileage" placeholder="172,350 km" required class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Transmission</label>
                    <input type="text" id="transmission" placeholder="Automatic" required class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-red-600">
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Features / Specs (Comma Separated)</label>
                <input type="text" id="specs" placeholder="2.0L 4 Cylinder, FWD, Heated Seats" required class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-red-600">
            </div>

            <div>
                <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Select All Photos</label>
                <input type="file" id="photos" multiple accept="image/*" required class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white text-sm">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded uppercase tracking-wider transition mt-4 shadow-lg shadow-red-600/30">
                Upload & Publish Vehicle
            </button>
        </form>

        <p id="status-msg" class="text-center text-sm mt-4 font-bold"></p>

        <!-- Manage / Delete Inventory Section -->
        <div class="mt-10 border-t border-gray-800 pt-6">
            <h2 class="text-xs uppercase font-bold text-gray-400 mb-4">Current Live Inventory</h2>
            <div id="admin-inventory-list" class="space-y-3">
                <p class="text-xs text-gray-500">Loading vehicles...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zqynkfsyznyhocvgvyca.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_iJlly47sXR8AqaH2BQQIpA_pJG48WIK';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Upload New Vehicle
        document.getElementById('vehicle-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('status-msg');
            
            btn.disabled = true;
            status.textContent = 'Uploading photos to server, please wait...';
            status.className = 'text-center text-sm mt-4 font-bold text-yellow-500';

            try {
                const files = document.getElementById('photos').files;
                const imageUrls = [];

                for (let file of files) {
                    const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
                    const fileName = `${Date.now()}-${cleanName}`;

                    const { data, error } = await supabaseClient.storage
                        .from('car-photos')
                        .upload(fileName, file);

                    if (error) {
                        console.error('Storage Upload Error:', error);
                        throw new Error(`Photo upload failed: ${error.message}`);
                    }

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('car-photos')
                        .getPublicUrl(fileName);

                    imageUrls.push(publicUrlData.publicUrl);
                }

                const { error: dbError } = await supabaseClient
                    .from('vehicles')
                    .insert([{
                        title: document.getElementById('title').value,
                        price: document.getElementById('price').value,
                        category: document.getElementById('category').value,
                        mileage: document.getElementById('mileage').value,
                        transmission: document.getElementById('transmission').value,
                        specs: document.getElementById('specs').value,
                        images: imageUrls
                    }]);

                if (dbError) {
                    console.error('Database Insert Error:', dbError);
                    throw new Error(`Database save failed: ${dbError.message}`);
                }

                status.textContent = 'Vehicle and photos published successfully!';
                status.className = 'text-center text-sm mt-4 font-bold text-green-500';
                document.getElementById('vehicle-form').reset();
                loadAdminInventory();

            } catch (err) {
                console.error('Form Error:', err);
                status.textContent = err.message || 'Error during upload. Please check browser console.';
                status.className = 'text-center text-sm mt-4 font-bold text-red-500';
            } finally {
                btn.disabled = false;
            }
        });

        // Load Live Vehicles for Deletion Management
        async function loadAdminInventory() {
            const listContainer = document.getElementById('admin-inventory-list');
            const { data: vehicles, error } = await supabaseClient.from('vehicles').select('*').order('created_at', { ascending: false });

            if (error || !vehicles || vehicles.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-gray-500">No vehicles listed.</p>';
                return;
            }

            listContainer.innerHTML = vehicles.map(car => `
                <div class="flex items-center justify-between bg-gray-800 p-3 rounded border border-gray-700">
                    <div>
                        <p class="text-sm font-bold text-white">${car.title}</p>
                        <p class="text-xs text-gray-400">${car.price} • ${car.mileage}</p>
                    </div>
                    <button onclick="deleteVehicle(${car.id})" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded text-xs font-bold transition">
                        Delete
                    </button>
                </div>
            `).join('');
        }

        // Delete Vehicle Handler
        async function deleteVehicle(id) {
            if (!confirm('Are you sure you want to delete this vehicle listing?')) return;

            const { error } = await supabaseClient.from('vehicles').delete().eq('id', id);

            if (error) {
                alert('Failed to delete vehicle: ' + error.message);
            } else {
                loadAdminInventory();
            }
        }

        // Initialize admin list
        loadAdminInventory();
    </script>
</body>
</html>
